name: Vérifications

on:
  pull_request:
    paths: ['docs/**', 'scripts/**', '.github/workflows/**']
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test 'scripts/lib/*.test.mjs'
      - run: node scripts/check-translations.mjs
      - run: node scripts/check-links.mjs
